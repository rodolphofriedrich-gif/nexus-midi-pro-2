name: Generate package-lock.json

on:
  workflow_dispatch: # Permite rodar manualmente pela aba "Actions"

permissions:
  contents: write # Permite que o workflow faça commit no repositório

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0' # Alinhado com o "engines" do seu package.json

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: gera package-lock.json via GitHub Actions"
          git push
