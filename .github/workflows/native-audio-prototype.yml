name: Native Audio Prototype - Android

on:
  push:
    branches:
      - experiment/fluidsynth-oboe-native-android-2026-11-14
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-audio-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-android:
    name: Build APK with FluidSynth and Oboe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Web assets and sync Capacitor
        run: |
          npm run build:android
          npx cap sync android

      - name: Build native Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusMIDI-Pro-native-audio-prototype
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
